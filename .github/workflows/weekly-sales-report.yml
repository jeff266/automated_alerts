name: Weekly Sales Report

on:
  schedule:
    # Run every Monday at 7:00 AM PST (15:00 UTC)
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      date:
        description: 'Reference date (YYYY-MM-DD, optional)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (do not send to Slack)'
        required: false
        type: boolean
        default: false

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send report
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          ZAPIER_WEBHOOK_URL: ${{ secrets.ZAPIER_WEBHOOK_URL }}
        working-directory: scripts
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            if [ -n "${{ github.event.inputs.date }}" ]; then
              python generate_weekly_sales_report.py --date "${{ github.event.inputs.date }}" --dry-run
            else
              python generate_weekly_sales_report.py --dry-run
            fi
          else
            if [ -n "${{ github.event.inputs.date }}" ]; then
              python generate_weekly_sales_report.py --date "${{ github.event.inputs.date }}"
            else
              python generate_weekly_sales_report.py
            fi
          fi
